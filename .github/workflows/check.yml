# 설정(lib/agents.json)·서버 코드를 고친 PR마다 검사한다.
# check-tool-args: 에이전트 지침에 적힌 `도구(인자=…)`의 인자 이름이 배포된 중계 서버가 주는 실제 도구 스키마에 있는지.
# 비밀값 RELAY_KEY(자동 점검 키)·RELAY_PAGE_KEY(페이지 확인 값)가 없으면 인자 검사는 건너뛴다.
name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
      - run: node scripts/check-catalog.js
      - run: node scripts/check-tool-args.js
        env:
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          RELAY_PAGE_KEY: ${{ secrets.RELAY_PAGE_KEY }}
